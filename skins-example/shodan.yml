# Uplift skin crate — "SHODAN" (System Shock // TriOptimum diagnostics).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
# Showcase: full token palette, SVG icons as readable block scalars, and an
# overlay that uses ONLY engine features (tokens cascade, motion gate).
# Iterate on ~/.omlx/uplift/skins/shodan-<mtime>/, repack with:
#   omlx-uplift skin compile ~/.omlx/uplift/skins/shodan-<mtime> -o shodan.yml
skin_version: 1
label: "SHODAN"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#1a0d0a"          # void black, Citadel hull
  card: "#22100c"        # laser-lit panel well
  row2: "#2a1410"
  field: "#120705"       # deep recessed readout
  panel: "#2a1410"
  edge: "#6e2415"        # ember rim (AA on the hull)
  ink: "#f2e9e1"         # bone
  dim: "#d8443a"         # laser crimson, tuned for small text
  accent: "#ffb14a"      # ember orange
  chart-1: "#ff4136"     # series 1: hot laser
  chart-2: "#ffb14a"     # series 2: ember
  grid: "#3a140c"
  heat: "#ffb14a"
  frame: "#c0392b"
  red: "#ff4136"         # the institution strip is her color now
  bad: "#ff4136"
  warn: "#ffb14a"
  good: "#ffb14a"        # under SHODAN, nominal means ember-lit
  hdr-ink: "#ff4136"     # crimson nav signage
  hdr-edge: "#6e2415"
  hdr-hover: "#2a0f0a"
  hdr-weight: "700"
  mono: "\"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace"
  sans: "\"IBM Plex Mono\", ui-monospace, \"SF Mono\", Menlo, monospace"
icons:
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
    <path d="M0 0h10L5 7z" fill="#ff4136"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
    <path d="M2 2l10 10M12 2L2 12" stroke="#ff4136" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M2 2l10 10M12 2L2 12" stroke="#ffb14a" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
    <circle cx="6" cy="6" r="6" fill="#2a0f0a"/>
    <circle cx="6" cy="6" r="5" fill="none" stroke="#ff4136" stroke-width="1.6"/>
    <circle cx="6" cy="6" r="2" fill="#ffb14a"/>
    </svg>
css: |-
  /* overlay loads ONLY while this skin is active — unscoped is scoped. */
  html { color-scheme: dark; }
  /* CRT ground: scan-lines + hull vignette */
  body {
      background:
          radial-gradient(120% 90% at 50% 0%, rgba(255,65,54,.05) 0%,
              rgba(0,0,0,.55) 100%),
          repeating-linear-gradient(0deg,
              #1a0d0a 0px, #1a0d0a 3px, #200f0b 3px, #200f0b 4px);
  }
  /* TriOptimum panel: laser rail atop every card */
  .card { border-top-color: var(--red); }
  .card:hover { border-color: var(--red); }
  /* wordmark: the diagnostics console announces itself */
  .logo::after {
      content: " // SYSTEM DIAGNOSTICS";
      color: var(--red); font: 400 9px/1 var(--mono); letter-spacing: .18em;
      margin-left: 8px;
  }
  /* her eye pulses on the telemetry strip — only while motion is allowed */
  :root:not([data-motion="off"]) .logo .dot {
      animation: shodan-pulse 2.4s ease-in-out infinite;
  }
  @keyframes shodan-pulse {
      0%, 100% { box-shadow: 0 0 4px rgba(255,65,54,.4); }
      50% { box-shadow: 0 0 10px rgba(255,65,54,.9); }
  }
  .logo .dot { box-shadow: 0 0 4px rgba(255,65,54,.4); }
  /* caution chips glow like station alarms */
  .rqchip { box-shadow: 0 0 6px rgba(255,65,54,.45); }
  /* hatched ember instrument bars */
  .meter > div {
      background: repeating-linear-gradient(45deg,
          var(--accent) 0 4px, #7a3a14 4px 6px);
  }
  .chip { border-style: dashed; }
  /* bone-on-laser selection, ember scrollbar rail */
  ::selection { background: var(--red); color: #1a0d0a; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--edge); border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--red); }
