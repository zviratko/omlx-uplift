# Uplift skin crate — "PHOSPHOR" (single-hue CRT, mono minimal).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# Direction 2 (SPARK-4): prove the token system collapses gracefully to one
# hue. Every "meaning" colour is the SAME phosphor green at a different
# intensity, and chart-1 == chart-2 == heat == accent == good, which is also
# the deliberate stress test for SPARK-1's seriesPalette() de-dupe: the palette
# must fall back to a tint, not draw two invisible coincident strokes.
#
# Texture: lightweight static phosphor-dust stipple. icons/grain.svg is a
# filter-free SVG dot mask tiled at 96px over the tube ground.
#
# Glitch (2026-10-02): the tube is alive. Two grain seeds boil at ~8 fps like
# static, a vertical-hold band rolls down the phosphor, the raster creeps, and
# three rare events fire on coprime clocks — a beam dropout with an amber
# convergence ghost on the lamp (3.7 s), the wordmark sagging for a beat
# (13.7 s), and a horizontal tear across the header ground (17.3 s). Every
# effect paints a BACKGROUND or the element's own glow: nothing ever overlays
# metric text, which this crate already rejects as a defect.
skin_version: 1
label: "Phosphor"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#050a05"          # tube, glass off
  card: "#08110a"        # well, one step of leaked light
  row2: "#0b170d"
  field: "#030703"       # unlit: darker than bg so fields read as recessed
  panel: "#0b170d"
  edge: "#1f4d28"        # bezel — the only desaturated green here
  ink: "#7dff9e"         # the lit trace
  dim: "#3fae5a"         # afterglow, 6.1:1 on card
  accent: "#33ff66"      # full-bias phosphor
  chart-1: "#33ff66"     # identical ON PURPOSE — see the header note
  chart-2: "#33ff66"
  grid: "#0f2713"
  heat: "#33ff66"
  frame: "#2a6b38"
  red: "#33ff66"         # one hue: the alarm is brighter, not different
  bad: "#33ff66"
  warn: "#33ff66"
  good: "#33ff66"
  hdr-ink: "#33ff66"
  hdr-edge: "#12351a"
  hdr-hover: "#0d1f11"
  hdr-weight: "600"
  mono: "ui-monospace, \"SFMono-Regular\", Menlo, monospace"
  sans: "ui-monospace, \"SFMono-Regular\", Menlo, monospace"
icons:
  # Phosphor dust: fractal noise, 4 octaves, stitched so the 96px tile has no
  # seam. feColorMatrix collapses RGB to black and copies RED into ALPHA, so
  # the art is a pure opacity mask — it tints to whatever ground it lands on.
  grain.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
      <g fill="#000" fill-opacity="0.22">
        <path d="M5 7h1v1H5zm18 4h1v1h-1zm27 2h1v1h-1zm21 6h1v1h-1zm16 3h1v1h-1zM11 19h1v1h-1zm24 5h1v1h-1zm19-2h1v1h-1zm28 4h1v1h-1zM7 33h1v1H7zm31 3h1v1h-1zm22-4h1v1h-1zm25 6h1v1h-1zM14 47h1v1h-1zm29 2h1v1h-1zm18 5h1v1h-1zm23-3h1v1h-1zM9 61h1v1H9zm25 4h1v1h-1zm27-2h1v1h-1zm21 5h1v1h-1zM16 76h1v1h-1zm22 3h1v1h-1zm26-4h1v1h-1zm19 6h1v1h-1zM6 88h1v1H6zm28 3h1v1h-1zm23-2h1v1h-1zm27 4h1v1h-1z"/>
      </g>
      <g fill="#33ff66" fill-opacity="0.045">
        <path d="M13 11h1v1h-1zm29 7h1v1h-1zm24-3h1v1h-1zm21 8h1v1h-1zM8 27h1v1H8zm26 4h1v1h-1zm31-2h1v1h-1zm17 6h1v1h-1zM19 41h1v1h-1zm23 5h1v1h-1zm28-3h1v1h-1zm18 7h1v1h-1zM12 56h1v1h-1zm32 3h1v1h-1zm19 5h1v1h-1zm25-4h1v1h-1zM7 71h1v1H7zm27 4h1v1h-1zm22-2h1v1h-1zm29 5h1v1h-1zM21 85h1v1h-1zm25 4h1v1h-1zm23-3h1v1h-1zm18 6h1v1h-1z"/>
      </g>
    </svg>
  grain-boil.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
      <g fill="#000" fill-opacity="0.24">
        <path d="M9 5h1v1H9zm22 6h1v1h-1zm25-2h1v1h-1zm23 7h1v1h-1zM15 21h1v1h-1zm26 4h1v1h-1zm21-3h1v1h-1zm24 6h1v1h-1zM6 35h1v1H6zm29 3h1v1h-1zm24-2h1v1h-1zm26 5h1v1h-1zM18 49h1v1h-1zm25 4h1v1h-1zm22-3h1v1h-1zm21 6h1v1h-1zM11 63h1v1h-1zm27 5h1v1h-1zm25-3h1v1h-1zm22 4h1v1h-1zM14 78h1v1h-1zm24 3h1v1h-1zm28-2h1v1h-1zm19 5h1v1h-1zM8 90h1v1H8zm26 2h1v1h-1zm25-3h1v1h-1zm24 4h1v1h-1z"/>
      </g>
      <g fill="#33ff66" fill-opacity="0.05">
        <path d="M17 9h1v1h-1zm27 6h1v1h-1zm22-2h1v1h-1zm21 7h1v1h-1zM10 25h1v1h-1zm28 5h1v1h-1zm26-3h1v1h-1zm19 6h1v1h-1zM21 39h1v1h-1zm24 4h1v1h-1zm25-2h1v1h-1zm18 6h1v1h-1zM14 54h1v1h-1zm29 4h1v1h-1zm21 4h1v1h-1zm24-3h1v1h-1zM9 69h1v1H9zm25 5h1v1h-1zm24-3h1v1h-1zm27 4h1v1h-1zM19 83h1v1h-1zm27 4h1v1h-1zm21-2h1v1h-1zm20 5h1v1h-1z"/>
      </g>
    </svg>
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="5" fill="#0a1a0d"/>
      <circle cx="6" cy="6" r="3" fill="#33ff66"/>
      <circle cx="6" cy="6" r="5" fill="none" stroke="#1f4d28" stroke-width="1"/>
    </svg>
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
      <path d="M0 0h10L5 7z" fill="#33ff66"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
      <path d="M2 2l10 10M12 2L2 12" stroke="#33ff66" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <circle cx="4" cy="2" r="1.1" fill="#2a6b38"/><circle cx="8" cy="2" r="1.1" fill="#2a6b38"/>
      <circle cx="12" cy="2" r="1.1" fill="#2a6b38"/><circle cx="4" cy="7" r="1.1" fill="#2a6b38"/>
      <circle cx="8" cy="7" r="1.1" fill="#2a6b38"/><circle cx="12" cy="7" r="1.1" fill="#2a6b38"/>
    </svg>
css: |-
  html { color-scheme: dark; }

  /* ---- tube ground: grain + scanlines + a lens vignette ---- */
  /* Layer order is top-to-bottom: grain over scanlines over vignette, so the
     dust sits on the glass rather than under the raster. */
  body {
      background-color: var(--bg);
      background-image:
          url('res/icons/grain.svg'),
          repeating-linear-gradient(0deg,
              rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px),
          radial-gradient(125% 95% at 50% 40%,
              #0a160c 0%, var(--bg) 62%, #010301 100%);
      background-size: 96px 96px, auto, cover;
      background-repeat: repeat, repeat, no-repeat;
  }
  body::before { background: var(--edge); }
  header.top {
      background-color: var(--bg);
      background-image:
          url('res/icons/grain.svg'),
          repeating-linear-gradient(0deg,
              rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px),
          radial-gradient(125% 95% at 50% 40%,
              #0a160c 0%, var(--bg) 62%, #010301 100%);
      background-size: 96px 96px, auto, cover;
      background-repeat: repeat, repeat, no-repeat;
  }

  /* ---- cards: the well is lit from inside, so the glow is inset ----
     The roll band is the vertical-hold artifact: a soft lit stripe that
     drifts down every card, painted as a card BACKGROUND layer (backgrounds
     always sit under content, so it can never wash over metric numbers —
     the same rule the old draft of this crate learned). It lives on the
     page document, not inside a background SVG, so its clock is host-side
     and can vary per card — see the lane rules below. Parked ABOVE the box
     at rest. */
  .card {
      background:
          linear-gradient(180deg, rgba(125, 255, 158, .13),
              rgba(125, 255, 158, 0)) 0 -60px / 100% 60px no-repeat,
          linear-gradient(180deg, #0a150c 0, var(--card) 44px) 0 0;
      border: 1px solid var(--edge);
      box-shadow: inset 0 0 26px rgba(51, 255, 102, .045);
  }
  .card:hover { border-color: var(--frame); box-shadow: inset 0 0 26px rgba(51,255,102,.09); }
  .card h2 { color: var(--dim); letter-spacing: .18em; }
  .chart-box { background: #040904; border: 1px solid #10240f; }

  /* ---- the roll: per-card clocks, never in lockstep ----
     Both layer positions are restated every keyframe: the ground gradient is
     box-sized so its own offset never changes, only the band travels. The
     final position is the SAME parked value as the unconditional rule, so
     motion-off = no band, exactly as if it had never been declared.
     CSS cannot roll dice, so "random" is built honestly: nine lanes on a
     prime cycle (9n+k). Each lane gets its OWN speed (8.3..10.7 s, ~+-12%
     around the old 9.7 s) and a negative delay that drops the card mid-roll
     at load, so phases differ from the first frame. All nine periods are
     pairwise-coprime (83, 89, 97, 101, 103, 107 ds are prime; 87=3*29,
     91=7*13, 95=5*19 share no factor with anything else), so two lanes
     only realign after their period product in seconds. A typical board
     (<=9 cards) gives every card a unique speed AND phase; lane doubles
     start at card 10 and still sit in different phases. Consecutive cards
     always land in different lanes, so no row marches. */
  :root:not([data-motion="off"]) #grid .card:hover {
      animation: ph-roll 9.7s linear infinite;
  }
  @keyframes ph-roll {
      from { background-position: 0 -60px, 0 0; }
      to   { background-position: 0 calc(100% + 60px), 0 0; }
  }
  /* The .card rules above also reach the static #pages cards (same class).
     Page tabs keep the plain lit-well look of the rest of this crate: band
     parked off-box, ground restored to its own single layer. */
  #pages .card {
      background: linear-gradient(180deg, #0a150c 0, var(--card) 44px);
  }
  :root:not([data-motion="off"]) #pages .card { animation: none; }

  /* ---- static swap on motion-on (without full-page background-position crawl) ---- */
  :root:not([data-motion="off"]) body {
      background-image:
          url('res/icons/grain-boil.svg'),
          repeating-linear-gradient(0deg,
              rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px),
          radial-gradient(125% 95% at 50% 40%,
              #0a160c 0%, var(--bg) 62%, #010301 100%);
  }

  /* ---- horizontal tear across the header ground, 17.3 s clock ----
     The fourth layer is the tear highlight itself: a 3px lit band parked
     off the top edge, invisible at rest. During the event window the ground
     layers jump sideways/vertically (sync loss) while the band sweeps down
     8 -> 26px in hard 60 ms steps, then everything parks again. Text is
     untouched: every layer here is a background, under every glyph.
     PITFALL (found by pixels here): position/size/repeat modifiers with '/'
     are legal only in the `background` SHORTHAND — inside `background-image`
     they invalidate the ENTIRE declaration (Chromium then falls back to the
     base sheet's `background:` shorthand = a flat colour, texture and all).
     So the layers are declared as four plain images + parallel lists. */
  header.top {
      background-image:
          url('res/icons/grain.svg'),
          repeating-linear-gradient(0deg,
              rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px),
          radial-gradient(125% 95% at 50% 40%,
              #0a160c 0%, var(--bg) 62%, #010301 100%),
          linear-gradient(180deg, rgba(125, 255, 158, .30),
              rgba(125, 255, 158, .10));
      background-size: 96px 96px, auto, cover, 100% 3px;
      background-repeat: repeat, repeat, no-repeat, no-repeat;
      background-position: 0 0, 0 0, 0 0, 0 -8px;
  }
  :root:not([data-motion="off"]) header.top {
      background-image:
          url('res/icons/grain-boil.svg'),
          repeating-linear-gradient(0deg,
              rgba(0, 0, 0, .34) 0 1px, transparent 1px 3px),
          radial-gradient(125% 95% at 50% 40%,
              #0a160c 0%, var(--bg) 62%, #010301 100%),
          linear-gradient(180deg, rgba(125, 255, 158, .30),
              rgba(125, 255, 158, .10));
      animation: ph-tear 17.3s linear infinite;
  }
  @keyframes ph-tear {
      0%, 61.999% { background-position: 0 0, 0 0, 0 0, 0 -8px; }
      62%, 62.999% { background-position: 7px 2px, 0 2px, 0 0, 0 8px; }
      63%, 63.999% { background-position: -6px -2px, 0 -2px, 0 0, 0 16px; }
      64%, 64.999% { background-position: 4px 1px, 0 1px, 0 0, 0 24px; }
      65%, 100%    { background-position: 0 0, 0 0, 0 0, 0 -8px; }
  }

  /* ---- the beam: decay, dropout, convergence ghost. Gated. ----
     One 3.7 s clock carries three acts: the beam strike and its afterglow
     decay (the crate's original), then a hard dropout to near-dark, then a
     single amber ghost — a phosphor tube with one tired gun bleeding
     off-colour while it re-converges. box-shadow only: it lives inside the
     lamp's own box and can never cover anything. ---- */
  :root:not([data-motion="off"]) .logo .dot {
      animation: phosphor-decay 3.7s ease-out infinite;
  }
  @keyframes phosphor-decay {
      0%    { box-shadow: 0 0 3px rgba(51, 255, 102, .35); }
      12%   { box-shadow: 0 0 15px rgba(51, 255, 102, .95); }
      55%   { box-shadow: 0 0 6px rgba(51, 255, 102, .45); }
      68%   { box-shadow: 0 0 3px rgba(51, 255, 102, .30); }
      69%   { box-shadow: 0 0 1px rgba(51, 255, 102, .06); }   /* dropout */
      70%   { box-shadow: 0 0 1px rgba(51, 255, 102, .06); }
      71%   { box-shadow: 2px 0 9px rgba(255, 176, 59, .8); }  /* ghost */
      72%   { box-shadow: 0 0 1px rgba(51, 255, 102, .06); }
      74%   { box-shadow: 0 0 10px rgba(51, 255, 102, .8); }   /* re-strike */
      100%  { box-shadow: 0 0 3px rgba(51, 255, 102, .35); }
  }

  /* ---- wordmark sag: the beam loses power for a beat, 13.7 s clock ----
     opacity dips (never display), so the wordmark dims but stays readable
     and the header layout cannot move. Two quick dips then a small
     recovery overshoot — power sagging, catching, settling. The final state
     equals the unconditional one (no gate-dependent look). */
  :root:not([data-motion="off"]) .logo {
      animation: ph-sag 13.7s linear infinite;
  }
  @keyframes ph-sag {
      0%, 70.999% { opacity: 1; }
      71%         { opacity: .35; }
      71.999%     { opacity: .35; }
      72%         { opacity: 1; }
      73%         { opacity: .6; }
      74%, 100%   { opacity: 1; }
  }

  /* No animated OVERLAY layer anywhere, and deliberately so. An earlier draft
     put a crawling scanline on a position:fixed pseudo — cards are
     position:relative with z-index:auto, so it painted OVER the metric
     numbers: a legibility defect, not a flourish. Every effect above is
     either a background (under all text, on both ground and cards) or the
     lamp's own box-shadow, so none of it can ever wash a value out. */

  /* ---- meters: the trace itself, stepped by the beam not by a gradient ---- */
  .meter { background: #030703; border: 1px solid var(--edge); }
  .meter > div {
      background: repeating-linear-gradient(90deg,
          var(--accent) 0 2px, #1f8f3d 2px 3px);
      box-shadow: 0 0 6px rgba(51, 255, 102, .5);
  }
  .meter.bad > div {
      background: repeating-linear-gradient(90deg,
          var(--bad) 0 2px, #1f8f3d 2px 3px);
  }

  .icon-btn:hover, select:hover { background: var(--accent); color: #041006; }
  ::selection { background: var(--accent); color: #041006; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #040904; }
  ::-webkit-scrollbar-thumb { background: var(--edge); border: 2px solid #040904; }
  ::-webkit-scrollbar-thumb:hover { background: var(--frame); }

  .logo .logo-below::after {
      content: "P1 · 12 KV · P22";
      color: var(--dim); font: 600 9px/1 var(--mono); letter-spacing: .22em;
  }
  .logo::after {
      content: ": WARMD";
      color: var(--accent); font: 600 9px/1 var(--mono); letter-spacing: .1em;
      margin-left: 6px;
  }
  .logo .dot { box-shadow: 0 0 6px rgba(51, 255, 102, .55); }
  .rqchip { box-shadow: 0 0 7px rgba(51, 255, 102, .35); border-color: var(--edge); }
