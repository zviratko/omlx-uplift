# Uplift skin crate — "INKWELL" (paper + ink, duotone minimal + one plate).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# Direction 2 (SPARK-4): the honest worst case for a token system — near-zero
# chroma. chart-1 and chart-2 differ mostly in VALUE; the 2026-10-07 revision
# (user: "the monochromatic look is too much, it needs a bit of colour")
# admits ONE hue — a print-shop registration teal on accent + secondary
# series — while structure and the state triad stay ink. It still exercises
# SPARK-1's seriesPalette() de-dupe on luminance separation and proves
# --grid/--dim stay legible with almost no colour to hide behind. State
# travels by SHAPE (square chips, hard rules) exactly as before.
#
# Texture: pure CSS laid paper — two cross hatches at 3px and 5px pitch
# (deliberately not multiples of each other, or the weave moires into visible
# bands) plus an ink-wash vignette. Zero bytes, cannot 404.
skin_version: 1
label: "Inkwell"
classic:
  theme: light
  enhanced: false
tokens:
  bg: "#f7f7f5"
  card: "#fdfdfb"
  row2: "#f1f1ee"
  field: "#eef0ed"
  panel: "#ececea"
  edge: "#d2d2cc"
  ink: "#1a1a1a"
  dim: "#5f5f5c"
  # SCALE-1 follow-up (user 2026-10-07: "the monochromatic look is too
  # much, it needs a bit of colour"): one hue joins the duotone — a deep
  # print-shop blue-green (registration-plate teal) on the ACCENT and the
  # secondary series only. Structure stays ink (titles, rules, frames, the
  # active tab); the state triad stays ink/dim so good/warn/bad remain a
  # SHAPE language, not a hue contest. Measured on every text ground
  # (card/row2/panel/field): accent 6.90:1 worst case — AA text.
  accent: "#14566b"
  chart-1: "#1a1a1a"
  # 3.51:1 as a stroke on card (>=3 is the line/graphics bar) and 4.19:1
  # against chart-1, so the two series stay separable on paper.
  chart-2: "#4f8494"
  grid: "#e6e6e2"
  heat: "#3d3d3a"
  frame: "#a8a8a3"
  red: "#1a1a1a"
  bad: "#1a1a1a"
  warn: "#5f5f5c"
  good: "#1a1a1a"
  hdr-ink: "#1a1a1a"
  hdr-edge: "#dededa"
  hdr-hover: "#ebebe7"
  hdr-weight: "400"
  mono: "ui-monospace, \"SFMono-Regular\", Menlo, monospace"
  sans: "\"Helvetica Neue\", \"Segoe UI\", system-ui, sans-serif"
icons:
  # Pen nib seen point-down at the measured 10px box: outline, slit, breather
  # hole. Three features is the ceiling at that size.
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
      <path d="M6 1.5L9.4 7.2 6 10.5 2.6 7.2z" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
      <path d="M6 5v4" stroke="#1a1a1a" stroke-width="1"/>
      <circle cx="6" cy="4.4" r="0.9" fill="#1a1a1a"/>
    </svg>
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
      <path d="M1.5 2L5 5.8 8.5 2" fill="none" stroke="#5f5f5c" stroke-width="1.4"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
      <path d="M3 3l8 8M11 3l-8 8" stroke="#1a1a1a" stroke-width="1.8"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <path d="M2 3h12M2 7h12" stroke="#a8a8a3" stroke-width="1"/>
    </svg>
css: |-
  html { color-scheme: light; }
  body {
      background-color: var(--bg);
      background-image:
          repeating-linear-gradient(90deg,
              rgba(90, 90, 86, .05) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(0deg,
              rgba(90, 90, 86, .038) 0 1px, transparent 1px 5px),
          radial-gradient(120% 80% at 50% -10%,
              #ffffff 0%, var(--bg) 55%, #ececea 100%);
      background-size: auto, auto, cover;
      background-repeat: repeat, repeat, no-repeat;
      background-attachment: fixed, fixed, fixed;
  }
  /* The 4px institution strip is the loudest object on a duotone page, so it
     takes the ink. No hue is allowed to shout here. */
  body::before { background: var(--ink); }
  /* Sticky header repeats the same pinned ground (see artelight.yml). */
  header.top {
      background-color: var(--bg);
      background-image:
          repeating-linear-gradient(90deg,
              rgba(90, 90, 86, .05) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(0deg,
              rgba(90, 90, 86, .038) 0 1px, transparent 1px 5px),
          radial-gradient(120% 80% at 50% -10%,
              #ffffff 0%, var(--bg) 55%, #ececea 100%);
      background-size: auto, auto, cover;
      background-repeat: repeat, repeat, no-repeat;
      background-attachment: fixed, fixed, fixed;
  }
  .card {
      background: var(--card);
      border: 1px solid var(--edge);
      box-shadow: 0 1px 2px rgba(26, 26, 26, .06);
  }
  .card:hover { border-color: var(--frame); }
  .card h2 {
      color: var(--ink); letter-spacing: .2em; text-transform: uppercase;
      font-weight: 400; border-bottom: 1px solid var(--grid);
  }
  .chart-box { background: #fbfbf9; border: 1px solid var(--grid); }
  /* Ink drying: the rule under a title is drawn once, then stays.
     The COMPLETED state is declared unconditionally, and only the drawing
     animation is gated. If background-size lived solely in the keyframes,
     motion-off would inherit `auto` and paint a solid ink bar behind every
     title — the off switch would render something the on switch never shows. */
  .card h2 {
      background-image: linear-gradient(90deg, var(--ink), var(--ink));
      background-repeat: no-repeat;
      background-position: 0 100%;
      background-size: 100% 1px;
  }
  :root:not([data-motion="off"]) .card h2 {
      animation: inkwell-write 4.1s ease-out forwards;
  }
  @keyframes inkwell-write {
      from { background-size: 0 1px; }
      to   { background-size: 100% 1px; }
  }
  /* Nib dip in the header: 7 s, coprime with the 4.1 s stroke above. */
  :root:not([data-motion="off"]) .logo .dot {
      animation: inkwell-dip 7s ease-in-out infinite;
  }
  @keyframes inkwell-dip {
      0%, 74%, 100% { transform: translateY(0); }
      80%           { transform: translateY(2px); }
      86%           { transform: translateY(0); }
  }
  .meter { background: #ececea; border: 1px solid var(--edge); }
  .meter > div { background: var(--ink); }
  /* .metric-now inherits --chart-2 from the base sheet (uplift.css:1803) and
     it is BOLD TEXT, not a stroke: at mid-teal that measures 3.51:1 on card —
     under the 4.5 text bar (the grey it replaces measured 3.36, so this is a
     pre-existing trap, not a regression). The readout takes the ink — a
     number is structure — and the teal stays where it is a stroke: series
     lines, the active timeframe chip (dark ink on mid-teal: 4.57), meters. */
  .metric-now { color: var(--ink); }
  .meter.bad > div { background: #55554f; }
  .icon-btn:hover, select:hover { background: var(--ink); color: var(--card); }
  ::selection { background: var(--ink); color: #ffffff; }
  /* The teal plate lands on solid grounds the base CSS paints with dark
     ink on top (.badge.Prefilling, .gs-box-title.sec-dirty, .se-tab.se-new
     :hover, .savebtn.queued — all read --ink-on-accent[-soft], defined at
     :root for the amber default). #0b0b0b on registration teal measures
     2.4:1, so the on-plate inks flip to paper here: 7.6:1. --ink itself
     must NOT flip — it is body text on paper everywhere else. */
  :root { --ink-on-accent: #f7f7f5; --ink-on-accent-soft: #f7f7f5; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #efefec; }
  ::-webkit-scrollbar-thumb { background: #c4c4bf; border: 2px solid #efefec; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink); }
  .logo .logo-below::after {
      content: "DUOTONE · 64 GSM · +1 PLATE";
      color: var(--dim); font: 400 9px/1 var(--mono); letter-spacing: .2em;
  }
  .logo::after {
      content: ": K + TEAL";
      color: var(--dim); font: 400 9px/1 var(--mono); letter-spacing: .1em;
      margin-left: 6px;
  }
  .rqchip { border: 1px solid var(--frame); border-radius: 0; }
  .chip { border-radius: 0; border-color: var(--edge); }
