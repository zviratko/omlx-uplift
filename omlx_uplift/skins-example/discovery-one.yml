# Uplift skin crate — "DISCOVERY ONE" (reactive motion showcase).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# SPARK-2 motion pack, crate 2 of 3: REACTIVE. Nothing animates because the
# skin feels like it — the HAL eye breathes, and a model row that is LOADED
# holds a steady light while a row that is LOADING beats like a pulse. The
# motion therefore reports state, which is the only honest reason to move.
# Palette: console green / EVA amber / HAL red. HUD lines are in-genre and
# invented, not quotations from the film or the novel.
skin_version: 1
label: "DISCOVERY ONE"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#04060a"          # hull interior, lamps down
  card: "#0a0f16"
  row2: "#0d141d"
  field: "#06090e"       # recessed console key
  panel: "#0d141d"
  edge: "#22323f"        # brushed panel seam
  ink: "#dff3e6"         # phosphor white-green
  dim: "#6f8f84"         # faded readout
  accent: "#e23b2e"      # the eye
  chart-1: "#4ade80"     # series 1: console green
  chart-2: "#38bdf8"     # series 2: EVA suit blue
  grid: "#14202b"
  heat: "#f59e0b"        # EVA warning amber
  frame: "#1b2a36"
  red: "#e23b2e"
  good: "#4ade80"        # ALL SYSTEMS NOMINAL
  warn: "#f59e0b"        # fault predicted
  bad: "#e23b2e"         # the eye goes red
  hdr-ink: "#9fd8bd"
  hdr-edge: "#18262f"
  hdr-hover: "#0d141d"
  hdr-weight: "600"
icons:
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
    <path d="M0 0h10L5 7z" fill="#9fd8bd"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
    <path d="M2 2l10 10M12 2L2 12" stroke="#9fd8bd" stroke-width="2.2" stroke-linecap="round"/>
    </svg>
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
    <rect x="0.5" y="0.5" width="11" height="11" rx="2" fill="#0a0f16" stroke="#22323f"/>
    <circle cx="6" cy="6" r="3.4" fill="#e23b2e"/>
    <circle cx="6" cy="6" r="1.4" fill="#ffd9d4"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <path d="M1 2h14M1 5h14M1 8h14" stroke="#22323f" stroke-width="1.4"/>
    </svg>

css: |-
  html { color-scheme: dark; }
  body {
      background:
          radial-gradient(120% 70% at 50% -8%, rgba(226,59,46,.07) 0%,
              rgba(0,0,0,0) 60%),
          repeating-linear-gradient(0deg, transparent 0 3px,
              rgba(159,216,189,.018) 3px 4px),
          var(--bg);
  }
  .card { border-color: var(--edge); }
  .card:hover { border-color: var(--hdr-ink); }
  .card h2 { color: var(--hdr-ink); letter-spacing: .2em; }
  ::selection { background: var(--good); color: #04060a; }

  /* H-AL inside the logo. Inline suffix is engine-capped at 24ch. */
  .logo::after {
      content: " // H-A-L 9000";
      color: var(--accent); font: 400 9px/1 var(--mono); letter-spacing: .18em;
      margin-left: 6px;
  }
  .logo .logo-below::after {
      content: "MISSION LOGIC CENTRAL  //  ALL SYSTEMS NOMINAL";
      color: var(--dim); font: 400 9px/1 var(--mono); letter-spacing: .09em;
  }

  /* --- REACTIVE MOTION -------------------------------------------------
     1. the eye breathes (one ambient pulse, 7 s, so it never nags) */
  :root:not([data-motion="off"]) .logo .dot {
      animation: disc-eye 7s ease-in-out infinite;
  }
  @keyframes disc-eye {
      0%, 100% { box-shadow: 0 0 2px rgba(226,59,46,.30); }
      50%      { box-shadow: 0 0 12px rgba(226,59,46,.85); }
  }

  /* 2. a LOADING model row beats; a LOADED row holds steady light. The
        states are the app's own classes on the rocker segment
        (.lsw-seg.load = LOADING ~Ns, .lsw-seg.on = LOADED) — the crate
        invents no state of its own, so the motion is a reading, not decor. */
  :root:not([data-motion="off"]) .admin-table .lsw-seg.load {
      animation: disc-beat 1.15s cubic-bezier(.3,0,.2,1) infinite;
  }
  @keyframes disc-beat {
      0%, 100% { box-shadow: 0 0 0 rgba(226,59,46,0); }
      18%      { box-shadow: 0 0 9px rgba(226,59,46,.7); }
      36%      { box-shadow: 0 0 0 rgba(226,59,46,0); }
      54%      { box-shadow: 0 0 6px rgba(226,59,46,.45); }
  }
  .admin-table .spill.on {
      border-color: var(--good); color: var(--good);
      box-shadow: 0 0 6px rgba(74,222,128,.28);
  }
  /* 3. the lamp in a lit stack reads the same steady light */
  .admin-table .lamp.on { box-shadow: 0 0 6px rgba(74,222,128,.35); }

  /* Hover is a state change, not decoration: gated, and short. */
  :root:not([data-motion="off"]) #model-admin .mbox {
      transition: border-color .15s linear, background-color .15s linear;
  }
  .meter > div {
      background: repeating-linear-gradient(45deg,
          var(--chart-1) 0 4px, #14202b 4px 7px);
  }
  .meter.bad > div {
      background: repeating-linear-gradient(45deg,
          var(--bad) 0 4px, #2a0d0b 4px 7px);
  }
