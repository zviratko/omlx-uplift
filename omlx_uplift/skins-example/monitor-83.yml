# Uplift skin crate — "MONITOR 83" (novelty motion showcase).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# SPARK-2 motion pack, crate 3 of 3: NOVELTY. A period-correct amber CRT:
# phosphor palette, lamp flicker, warm-up glow under the header, keybounce
# transitions on controls. Pure overlay CSS — no new engine capability, no
# JS. Full-page scanline/roller overlays were TRIED AND REJECTED: the fixed
# red institution strip (body::before, z-index 60) plus the sticky header
# (z-index 55) leave no safe layer for a fixed overlay that sits above
# content, and below content it is invisible on opaque cards.
# No franchise here: "MONITOR 83" is an invented generic terminal name.
skin_version: 1
label: "MONITOR 83"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#0b0803"          # phosphor room, lamps off
  card: "#14100a"
  row2: "#191409"
  field: "#0d0a04"       # recessed screen
  panel: "#191409"
  edge: "#4a3a17"        # bezel brass
  ink: "#ffc46b"         # amber P3 phosphor
  dim: "#a1793c"         # faded trace
  accent: "#ffb000"      # full-brightness amber
  chart-1: "#ffb000"     # series 1: amber trace
  chart-2: "#6ad0ff"     # series 2: the cyan secondary gun
  grid: "#241a08"
  heat: "#ff7a1a"        # hot overdrive
  frame: "#3a2c10"
  red: "#ff5b3a"
  good: "#7ddf6a"        # green gun, ready lamp
  warn: "#ffb000"        # amber, attention
  bad: "#ff5b3a"         # red, fail
  hdr-ink: "#e8a94a"
  hdr-edge: "#2c2109"
  hdr-hover: "#191409"
  hdr-weight: "700"
icons:
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
    <path d="M0 0h10L5 7z" fill="#ffb000"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
    <path d="M2 2l10 10M12 2L2 12" stroke="#ffb000" stroke-width="2.6"/>
    </svg>
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
    <circle cx="6" cy="6" r="5.5" fill="#14100a" stroke="#4a3a17"/>
    <circle cx="6" cy="6" r="2.6" fill="#ffb000"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <path d="M1 2h14M1 5h14M1 8h14" stroke="#4a3a17" stroke-width="1.4"/>
    </svg>

css: |-
  html { color-scheme: dark; }
  /* amber room glow */
  body {
      background:
          radial-gradient(120% 80% at 50% 0%, rgba(255,176,0,.06) 0%,
              rgba(0,0,0,0) 55%),
          var(--bg);
  }
  .card { border-color: var(--edge); }
  .card h2 { color: var(--hdr-ink); letter-spacing: .14em; }
  ::selection { background: var(--accent); color: #0b0803; }

  /* terminal signage: inline slot <= 24ch, below slot the long banner */
  .logo::after {
      content: "> MONITOR 83";
      color: var(--accent); font: 700 9px/1 var(--mono); letter-spacing: .18em;
      margin-left: 6px;
  }
  .logo .logo-below::after {
      content: "PHOSPHOR P3  80x25  9600 BAUD  NO WARRANTY";
      color: var(--dim); font: 400 9px/1 var(--mono); letter-spacing: .10em;
  }

  /* --- NOVELTY MOTION ---------------------------------------------------
     Lamp flicker + header warm-up glow + keybounce on controls. Gated as a
     whole: motion off -> dead still, the screen reads as a cold CRT photo. */
  :root:not([data-motion="off"]) .logo .dot {
      animation: crt-flicker 5.7s steps(1) infinite;
  }
  @keyframes crt-flicker {
      0%, 92%, 100% { box-shadow: 0 0 5px rgba(255,176,0,.55); opacity: 1; }
      94%           { box-shadow: 0 0 1px rgba(255,176,0,.2); opacity: .75; }
      96%           { box-shadow: 0 0 7px rgba(255,176,0,.7); opacity: 1; }
  }
  :root:not([data-motion="off"]) header.top {
      animation: crt-warm 6.5s ease-in-out infinite;
  }
  @keyframes crt-warm {
      0%, 100% { border-bottom-color: var(--hdr-edge); }
      50%      { border-bottom-color: rgba(255,176,0,.55); }
  }
  /* a warm-up blink when a control takes the pointer — period-correct
     keybounce, so short it cannot nag (and gated, like everything else) */
  :root:not([data-motion="off"]) .btn, :root:not([data-motion="off"]) .chip {
      transition: color .12s linear, border-color .12s linear,
          box-shadow .12s linear;
  }
  .btn:hover, .chip:hover { box-shadow: 0 0 7px rgba(255,176,0,.35); }
  .meter > div {
      background: repeating-linear-gradient(90deg,
          var(--chart-1) 0 2px, #241a08 2px 6px);
  }
