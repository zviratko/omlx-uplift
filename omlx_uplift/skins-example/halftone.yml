css: |-
  html { color-scheme: light; }

  /* ---- one variable file carries every weight: the range form ---- */
  /* `font-weight: 400 900` declares the axis span the woff2 actually holds.
     Written as one face rather than two, so a 700-weight header interpolates
     instead of falling back to the ui font — the failure mode this crate
     exists to catch. */
  @font-face { font-family: 'Tektur'; font-style: normal;
    font-weight: 400 900; font-display: swap;
    src: url('res/fonts/tektur-latin.woff2') format('woff2'); }

  /* ---- page ground: printed stock ---- */
  body {
      background-color: var(--bg);
      background-image:
          url('res/icons/halftone.svg'),
          linear-gradient(180deg, rgba(255,255,255,.5), rgba(0,0,0,0) 220px);
      background-size: 6px 6px, cover;
      background-repeat: repeat, no-repeat;
      background-attachment: fixed, fixed;
  }
  body::before { background: var(--red); }
  header.top {
      background-color: var(--bg);
      background-image:
          url('res/icons/halftone.svg'),
          linear-gradient(180deg, rgba(255,255,255,.5), rgba(0,0,0,0) 220px);
      background-size: 6px 6px, cover;
      background-repeat: repeat, no-repeat;
      background-attachment: fixed, fixed;
  }

  /* ---- cards: a laid sheet, with the crop mark in the corner ---- */
  .card {
      background: var(--card);
      border: 1px solid var(--edge);
  }
  .card:hover { border-color: var(--frame); }
  /* Crop marks: corner registration ticks. Painted inside the border so the
     0px inter-card gutters cannot clip them (see skill: paint order). */
  .card::after {
      content: ""; position: absolute; inset: 4px; pointer-events: none;
      background:
          linear-gradient(var(--frame), var(--frame)) 0 0 / 8px 1px,
          linear-gradient(var(--frame), var(--frame)) 0 0 / 1px 8px,
          linear-gradient(var(--frame), var(--frame)) 100% 0 / 8px 1px,
          linear-gradient(var(--frame), var(--frame)) 100% 0 / 1px 8px;
      background-repeat: no-repeat;
      opacity: .7;
  }
  .card h2 { color: var(--ink); letter-spacing: .1em; }

  /* ---- the plate rolling: registration bar sweeps the header. Gated. ---- */
  :root:not([data-motion="off"]) header.top {
      animation: halftone-roll 9s linear infinite;
  }
  @keyframes halftone-roll {
      0%   { border-bottom-color: var(--hdr-edge); }
      6%   { border-bottom-color: var(--accent); }
      12%  { border-bottom-color: var(--hdr-edge); }
      100% { border-bottom-color: var(--hdr-edge); }
  }
  /* Ink drum turn on the logo: 5 s against the 9 s roll — coprime. */
  :root:not([data-motion="off"]) .logo .dot {
      animation: halftone-spin 5s linear infinite;
  }
  @keyframes halftone-spin { to { transform: rotate(360deg); } }

  /* ---- meters: solid plate ink, screen density for the remainder ---- */
  .meter { background: #e2ddd3; border: 1px solid var(--edge); }
  .meter > div { background: var(--ink); }
  .meter.bad > div { background: var(--bad); }

  .icon-btn:hover, select:hover { background: var(--ink); color: var(--card); }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #e7e2d8; }
  ::-webkit-scrollbar-thumb { background: #bdb6a7; border: 2px solid #e7e2d8; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ink); }

  /* Press slug under the wordmark. 21 chars at 9px — inside the ~50ch cap.
     Middle dots are literal UTF-8: a CSS escape like \00B7 eats the space
     that terminates it, so "\00B7 CMYK" would render as "·CMYK". */
  .logo .logo-below::after {
      content: "150 LPI · CMYK · LAT1";
      color: var(--accent); font: 700 9px/1 var(--mono); letter-spacing: .18em;
  }
  .logo::after {
      content: ": RUN 01";
      color: var(--dim); font: 500 9px/1 var(--mono); letter-spacing: .1em;
      margin-left: 6px;
  }
  .rqchip { border-color: var(--frame); }
