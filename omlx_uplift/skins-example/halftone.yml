# Uplift skin crate — "HALFTONE" (rotary press, light + bundled webfont).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# Direction 3 (SPARK-4): the SECOND data point for the fonts: pipeline, and a
# deliberately harder one than shodan. The family here is Tektur, a VARIABLE
# font — one woff2 file carries the whole 400..900 weight axis, so the crate
# tests the `font-weight: <low> <high>` range form rather than two discrete
# @font-face records.
#
# Licence: Tektur is OFL 1.1 (verified in google/fonts ofl/tektur/OFL.txt).
# OFL requires the notice to travel with the font, so the full licence text is
# reproduced below AND shipped as a real file (fonts/OFL.txt — the engine
# whitelists any fonts/<name>, so it is served at
# /uplift/api/skins/<dir>/res/fonts/OFL.txt).
#
# Texture: a real halftone screen — icons/halftone.svg tiles four low-alpha
# dots on a 6px rosette, which is what a rotary press actually leaves on
# paper. Over the ink areas it reads as print density, not as a pattern.
skin_version: 1
label: "Halftone"
classic:
  theme: light
  enhanced: false
tokens:
  bg: "#efece6"          # uncoated stock, warm off-white not bleached
  card: "#faf8f4"
  row2: "#e9e5dd"
  field: "#fffefb"
  panel: "#e4e0d7"
  edge: "#c9c3b6"
  ink: "#17181a"         # process black
  dim: "#656057"         # AA on every ground (min 4.7:1, panel is the binding one)
  accent: "#c8102e"      # the pressman's registration red
  chart-1: "#17181a"     # series 1 = black plate
  chart-2: "#c8102e"     # series 2 = the red plate
  grid: "#ddd8ce"
  heat: "#d4691e"
  frame: "#b3ac9e"
  red: "#c8102e"
  bad: "#a1102a"
  warn: "#b5701a"
  good: "#2c6e49"
  hdr-ink: "#17181a"
  hdr-edge: "#d8d2c6"
  hdr-hover: "#e7e2d8"
  hdr-weight: "700"
  mono: "\"Tektur\", ui-monospace, Menlo, monospace"
  sans: "\"Tektur\", \"Helvetica Neue\", system-ui, sans-serif"
icons:
  # Registration mark: the crosshair a pressman squares the plates against,
  # which is the one glyph that says "printing" at a 10px box.
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
      <circle cx="6" cy="6" r="4.2" fill="none" stroke="#c8102e" stroke-width="1.2"/>
      <path d="M6 0v12M0 6h12" stroke="#17181a" stroke-width="0.9"/>
    </svg>
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
      <path d="M1 2l4 4 4-4" fill="none" stroke="#6a655c" stroke-width="1.5"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
      <path d="M3 3l8 8M11 3l-8 8" stroke="#c8102e" stroke-width="2"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <circle cx="3" cy="2.5" r="1" fill="#b3ac9e"/><circle cx="8" cy="2.5" r="1" fill="#b3ac9e"/>
      <circle cx="13" cy="2.5" r="1" fill="#b3ac9e"/><circle cx="3" cy="7.5" r="1" fill="#b3ac9e"/>
      <circle cx="8" cy="7.5" r="1" fill="#b3ac9e"/><circle cx="13" cy="7.5" r="1" fill="#b3ac9e"/>
    </svg>
  # Halftone rosette: 4 dots, one per corner offset by a half cell so the tile
  # repeats seamlessly (corner dots are shared with all four neighbours).
  halftone.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" width="6" height="6" viewBox="0 0 6 6">
      <circle cx="3" cy="3" r="0.95" style="fill:#000;fill-opacity:.085"/>
      <circle cx="0" cy="0" r="0.7" style="fill:#000;fill-opacity:.05"/>
      <circle cx="6" cy="0" r="0.7" style="fill:#000;fill-opacity:.05"/>
      <circle cx="0" cy="6" r="0.7" style="fill:#000;fill-opacity:.05"/>
      <circle cx="6" cy="6" r="0.7" style="fill:#000;fill-opacity:.05"/>
    </svg>
fonts:
  # OFL-1.1 notice for tektur-latin.woff2 below, so the licence travels
  # WITH the font as the licence requires (served at res/fonts/OFL.txt).
  # Verbatim from github.com/google/fonts ofl/tektur/OFL.txt except that
  # the engine's block-scalar contract forbids lines ending in whitespace,
  # so one trailing space on the "bundled, embedded," line is stripped.
