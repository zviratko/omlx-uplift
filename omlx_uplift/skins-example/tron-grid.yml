# Uplift skin crate — "TRON: THE GRID" (ambient motion showcase).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# SPARK-2 motion pack, crate 1 of 3: AMBIENT. One slow glow that travels the
# header rule and breathes on the telemetry lamp — nothing on the board
# blinks at you. Palette: identity blue on black ice; the state triad is
# program / recognizer / the Game — cyan, amber, red. Header text lines are
# descriptive and in-genre, NOT quotations from the films.
skin_version: 1
label: "TRON: THE GRID"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#05070c"          # the dark space between grid lines
  card: "#0a1220"
  row2: "#0d1728"
  field: "#060b14"       # recessed panel, black ice
  panel: "#0d1728"
  edge: "#12557a"        # grid line, lit
  ink: "#e6f6ff"         # user-white
  dim: "#6c9fc4"         # washed circuit blue
  accent: "#22d3ee"      # identity cyan
  chart-1: "#22d3ee"     # series 1: cyan trace
  chart-2: "#7c8cff"     # series 2: violet program
  grid: "#0f2438"
  heat: "#fbbf24"        # recognizer amber runs hot
  frame: "#0e3a56"
  red: "#ff3b30"
  good: "#22d3ee"        # program online
  warn: "#fbbf24"        # recognizer inbound
  bad: "#ff3b30"         # the Game
  hdr-ink: "#8fd8f2"
  hdr-edge: "#0f3550"
  hdr-hover: "#0d1728"
  hdr-weight: "600"
icons:
  caret.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 8">
    <path d="M0 0h10L5 7z" fill="#22d3ee"/>
    </svg>
  close.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 14 14">
    <path d="M2 2l10 10M12 2L2 12" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="square"/>
    </svg>
  logo-dot.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12">
    <rect x="0.5" y="0.5" width="11" height="11" fill="#05070c" stroke="#12557a"/>
    <rect x="4" y="4" width="4" height="4" fill="#22d3ee"/>
    </svg>
  grip.svg: |-
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10">
      <path d="M1 2h14M1 5h14M1 8h14" stroke="#12557a" stroke-width="1.4"/>
    </svg>

css: |-
  html { color-scheme: dark; }
  /* The Grid: black space, one lit lattice, nothing decorative on top */
  body {
      background:
          linear-gradient(rgba(34,211,238,.035) 1px, transparent 1px) 0 0
              / 100% 34px,
          linear-gradient(90deg, rgba(34,211,238,.035) 1px, transparent 1px)
              0 0 / 34px 100%,
          radial-gradient(140% 80% at 50% 0%, rgba(18,85,122,.18) 0%,
              rgba(0,0,0,0) 70%),
          var(--bg);
  }
  .card { border-color: var(--edge); }
  .card:hover { border-color: var(--accent); }
  .card h2 { color: var(--hdr-ink); letter-spacing: .18em; }
  ::selection { background: var(--accent); color: #05070c; }

  /* Header wordmark slots (inline suffix <= 24ch, below-slot <= ~50ch) */
  .logo::after {
      content: " // THE GRID";
      color: var(--accent); font: 400 9px/1 var(--mono); letter-spacing: .16em;
      margin-left: 6px;
  }
  .logo .logo-below::after {
      content: "1 PROGRAM ONLINE  //  I/O NOMINAL";
      color: var(--dim); font: 400 9px/1 var(--mono); letter-spacing: .10em;
  }

  /* --- AMBIENT MOTION (the whole point of this crate) -----------------
     A glow walks the header's bottom rule every 11 s and the lamp breathes.
     Both are gated: the motion switch stops them dead, no leftover movement. */
  :root:not([data-motion="off"]) header.top {
      animation: tron-rule 11s linear infinite;
  }
  @keyframes tron-rule {
      0%   { border-bottom-color: var(--hdr-edge);
             box-shadow: 0 1px 0 rgba(34,211,238,0); }
      45%  { border-bottom-color: var(--accent);
             box-shadow: 0 1px 12px rgba(34,211,238,.35); }
      100% { border-bottom-color: var(--hdr-edge);
             box-shadow: 0 1px 0 rgba(34,211,238,0); }
  }
  :root:not([data-motion="off"]) .logo .dot {
      animation: tron-lamp 4.5s ease-in-out infinite;
  }
  @keyframes tron-lamp {
      0%, 100% { box-shadow: 0 0 2px rgba(34,211,238,.25); }
      50%      { box-shadow: 0 0 10px rgba(34,211,238,.75); }
  }

  /* Hover response on cards is a state change, not ambient noise: keep it
     short and gate it too, or the switch would still be lying. */
  :root:not([data-motion="off"]) .card {
      transition: border-color .18s linear, box-shadow .18s linear;
  }
  .rqchip { box-shadow: 0 0 5px rgba(34,211,238,.35); }
  .meter > div {
      background: repeating-linear-gradient(90deg,
          var(--chart-1) 0 3px, #0f2438 3px 7px);
  }
