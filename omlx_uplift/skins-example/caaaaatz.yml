# Uplift skin crate — "CAAAAATZ!" (user-approved theme: cats, overloaded).
# Copy into ~/.omlx/uplift/skins/ — active on the next refresh, no restart.
#
# SPARK-5, second pass. The first pass drew cats at their literal render size
# and used emoji for the scene cats; the user rejected the icons as crude, so
# every mark here is hand-drawn line art authored to the box it actually
# renders in (logo-dot 10px, caret 12px, close 18px, grip 16x10, scenes
# 11-24px) — one closed silhouette each, two or three features maximum.
#
# Bespoke AND moving, with ZERO engine change: every mark ships in two cuts,
# still and self-animating (declarative CSS inside the SVG, which does run in
# the no-script background-image context — verified, not assumed). The
# overlay mounts the still cut, and the [data-motion] block swaps in the
# animated one, so the motion switch returns a still drawing rather than an
# animation frozen mid-blink. Resource URLs stay RELATIVE (res/icons/...) so
# the crate works as a user dir and as a .bundled-<name>-<stamp> copy alike.
#
# Honest limit, unchanged: uPlot paints axes AND data into <canvas>, so no cat
# can enter the plot from CSS. The begging cat sits at the card's foot and
# bats at the DOM legend instead. Canvas glyphs/confetti would need engine
# callbacks — logged in the ticket as future generic hooks, not hacked here.
#
# No webfont bundled: no license-verified cat letterform was found (skill
# rule); the rounded read comes from the --sans system stack.
# "CAAAAATZ!" is an original yowl, not a quotation from any franchise.
skin_version: 1
label: "CAAAAATZ!"
classic:
  theme: dark
  enhanced: false
tokens:
  bg: "#221a1e"          # sofa-in-dusk, warm charcoal
  card: "#2c2227"
  row2: "#332830"
  field: "#1b1417"       # recessed basket
  panel: "#332830"
  edge: "#5c4450"        # dusty plum seam
  ink: "#f6eae4"         # cream cat
  dim: "#bfa6ad"         # faded tortoiseshell
  accent: "#ff6f61"      # cat-toy coral-red
  chart-1: "#cfc4c9"     # mice-grey (primary series)
  chart-2: "#ff6f61"     # cat-toy red (secondary series)
  grid: "#3a2d34"
  heat: "#f4a259"        # treat-jar amber (heatmap hot cells)
  frame: "#7a5766"
  red: "#e23b2e"
  good: "#79c76a"        # purr-green — the cat approves
  warn: "#f4a259"        # slow-blink amber — the cat is deciding
  bad: "#e23b2e"         # hiss red — do not touch the cat
  hdr-ink: "#e9c9cf"
  hdr-edge: "#4a3540"
  hdr-hover: "#332830"
  hdr-weight: "700"
  sans: "ui-rounded, 'Avenir Next Rounded', 'Trebuchet MS', system-ui, sans-serif"

# Line-art marks. caret/close/logo-dot/grip are the four basenames the engine
# turns into --icon-* variables (the still cut); the '-motion' files and the
# four scene cats are servable resources the overlay mounts by relative path.
