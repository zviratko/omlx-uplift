name: tests

# CI-1: free ubuntu runner. omlx is not on PyPI and is Apple-Silicon/MLX
# bound, so it can NEVER be installed here; tests/conftest.py turns the
# omlx-dependent tests into honest skips (13 as of 2026-10-02) and the
# rest of the suite runs for real. The full omlx-dependent run stays on
# the macOS dev box (keg python recipe in README 'Development').

on:
  push:
    # NAT batch: feature-branch CI is paused (user request 2026-10-08 —
    # red emails while the branch intentionally lands commits that only
    # run fully on the macOS dev box). RE-ENABLE by adding
    # `feat/native-bench-chat` back to this list once the branch suite
    # is CI-green locally with `unset OMLX_* ; python -m pytest` on a
    # machine without ~/.omlx (two known branch-only failures pinned in
    # the card note; main stays protected meanwhile).
    branches: [main]
    # REL-1: a pushed release tag must prove itself — the tagged commit
    # runs CI too, so `brew install` only ever builds something green.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (omlx unresolvable on PyPI — deps minus omlx)
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn" pyyaml pytest pytest-asyncio httpx
      - name: pytest (omlx-dependent tests skip with reason)
        run: python -m pytest tests -q

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every shipped script
        run: for f in omlx_uplift/static/*.js; do node --check "$f"; done
      - name: node --test (dashboard regression suite)
        run: node --test tests/*.cjs
