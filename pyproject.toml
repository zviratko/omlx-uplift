# Uplift dashboard — opt-in companion UI + metrics for oMLX.
# Vanilla oMLX stays byte-identical; this package mounts itself into
# omlx.server.app via the autopatch .pth (pip/brew) or the `omlx-uplift
# serve` wrapper, and serves the same UI standalone for DMG users
# (`omlx-uplift view`).
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omlx-uplift"
dynamic = ["version"]
description = "Uplift dashboard: opt-in companion UI, live request feed and persistent metrics for oMLX"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "omlx",
    "fastapi>=0.110",
    "uvicorn",
    # skins.py parses crate YAML directly; satisfied transitively by omlx
    # today, but a direct import needs a direct declaration (CI without
    # omlx proved it).
    "pyyaml",
    # /uplift/v1/audio/speech parses form/multipart bodies via
    # request.form() — starlette hard-requires python-multipart for that
    # (AssertionError -> 500 without it). Present in every real deploy
    # ONLY as omlx's transitive dep; same direct-import rule as pyyaml,
    # and CI caught exactly that (6 std-route tests, 2026-10-11).
    "python-multipart>=0.0.5",
]

[project.scripts]
omlx-uplift = "omlx_uplift.cli:main"

[tool.setuptools.dynamic]
version = { attr = "omlx_uplift.__version__" }

[tool.setuptools.packages.find]
include = ["omlx_uplift*"]

[tool.setuptools.package-data]
"omlx_uplift" = ["static/**/*", "locales/*.json", "skins-example/*.yml",
                 "man/*.1", "bench_env_requirements.txt",
                 "mteb_env_requirements.txt",
                 "evals/systemone/data/*.json"]
# REPL-2b carryover: the custom generative lm-eval task pack. Not a
# Python package (no __init__.py) — lm_eval reads it straight from the
# installed tree via --include_path, so it must ship as data.
# cmmlu_data: the vendored CMMLU splits the cmmlu twin scores (the hub
# ships only a refused datasets-script — see cmmlu_data/PROVENANCE.md).
# The jsonl are reached through Path(__file__) in
# yamls/uplift_generative_utils.cmmlu_dataset, so they must be installed
# next to the yamls in the wheel, exactly like the yamls themselves.
"omlx_uplift.bench_tasks" = ["yamls/*.yaml", "yamls/*.py",
                             "cmmlu_data/PROVENANCE.md",
                             "cmmlu_data/test/*.jsonl",
                             "cmmlu_data/dev/*.jsonl"]

# Autopatch .pth ('import omlx_uplift.autopatch') is written by
# `omlx-uplift install [--python PATH]` — used by brew post_install and the
# deploy script, because pip data_files placement varies across venv
# layouts. Without the .pth everything still works via `omlx-uplift serve`.
# DMG environments never install this package and stay untouched.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
